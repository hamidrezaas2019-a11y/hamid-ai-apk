<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🤖 هوش مصنوعی کامل - ChatGPT Clone Pro</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        /* ============================================================
           CSS کامل - نسخه پرو با همه امکانات
           ============================================================ */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0d0d0d;
            --bg-secondary: #1a1a1a;
            --bg-card: #242424;
            --bg-hover: #2a2a2a;
            --bg-input: #2a2a2a;
            --text-primary: #e5e5e5;
            --text-secondary: #888888;
            --text-muted: #555555;
            --accent-green: #10a37f;
            --accent-green-dark: #0d8a6a;
            --accent-blue: #4d6bfe;
            --accent-purple: #7c3aed;
            --border-color: #2a2a2a;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.6);
            --radius: 12px;
            --radius-sm: 8px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--text-muted);
            border-radius: 10px;
        }

        /* ============================================================
           SIDEBAR
           ============================================================ */
        .sidebar {
            width: 280px;
            background: var(--bg-secondary);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            height: 100vh;
            overflow: hidden;
            transition: 0.3s;
            position: relative;
        }

        .sidebar-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .sidebar-header .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .sidebar-header .logo .icon {
            font-size: 24px;
        }
        .sidebar-header .logo h1 {
            font-size: 17px;
            font-weight: 700;
            color: #fff;
        }
        .sidebar-header .new-chat-btn {
            background: var(--accent-green);
            border: none;
            color: #fff;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .sidebar-header .new-chat-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(16, 163, 127, 0.4);
        }

        /* ===== USER ===== */
        .sidebar-user {
            padding: 10px 16px;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .sidebar-user .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--accent-green);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 700;
            color: #fff;
        }
        .sidebar-user .info {
            flex: 1;
        }
        .sidebar-user .info .name {
            font-size: 13px;
            font-weight: 600;
            color: #fff;
        }
        .sidebar-user .info .plan {
            font-size: 10px;
            color: var(--text-muted);
        }
        .sidebar-user .info .plan .badge {
            background: var(--accent-green);
            color: #fff;
            padding: 1px 8px;
            border-radius: 10px;
            font-size: 9px;
        }

        /* ===== MENU ===== */
        .sidebar-menu {
            padding: 6px 10px;
            flex-shrink: 0;
        }
        .sidebar-menu .menu-item {
            padding: 8px 12px;
            border-radius: var(--radius);
            cursor: pointer;
            transition: 0.3s;
            font-size: 13px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .sidebar-menu .menu-item:hover {
            background: var(--bg-hover);
            color: #fff;
        }
        .sidebar-menu .menu-item.active {
            background: var(--bg-card);
            color: #fff;
        }
        .sidebar-menu .menu-item .icon {
            font-size: 16px;
            width: 20px;
            text-align: center;
        }

        /* ===== CHAT HISTORY ===== */
        .chat-history {
            flex: 1;
            overflow-y: auto;
            padding: 4px 8px;
        }
        .chat-history .history-item {
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: 0.3s;
            font-size: 13px;
            color: var(--text-secondary);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1px;
        }
        .chat-history .history-item:hover {
            background: var(--bg-hover);
            color: #fff;
        }
        .chat-history .history-item.active {
            background: var(--bg-card);
            color: #fff;
        }
        .chat-history .history-item .delete-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 12px;
            opacity: 0;
            transition: 0.3s;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .chat-history .history-item:hover .delete-btn {
            opacity: 1;
        }
        .chat-history .history-item .delete-btn:hover {
            color: #ef4444;
            background: rgba(239, 68, 68, 0.1);
        }

        /* ===== SIDEBAR FOOTER ===== */
        .sidebar-footer {
            padding: 6px 10px;
            border-top: 1px solid var(--border-color);
            flex-shrink: 0;
        }
        .sidebar-footer .footer-item {
            padding: 8px 12px;
            border-radius: var(--radius);
            cursor: pointer;
            transition: 0.3s;
            font-size: 13px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .sidebar-footer .footer-item:hover {
            background: var(--bg-hover);
            color: #fff;
        }
        .sidebar-footer .footer-item .icon {
            font-size: 16px;
            width: 20px;
            text-align: center;
        }

        /* ============================================================
           MAIN
           ============================================================ */
        .main-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* ===== TOP BAR ===== */
        .top-bar {
            background: var(--bg-secondary);
            padding: 8px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
            min-height: 50px;
        }
        .top-bar .left-section {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .top-bar .left-section .mobile-menu-btn {
            display: none;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 20px;
            cursor: pointer;
        }
        .top-bar .left-section .title {
            font-size: 14px;
            color: var(--text-secondary);
        }
        .top-bar .right-section {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .top-bar .right-section .btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 4px 12px;
            border-radius: 16px;
            cursor: pointer;
            font-size: 12px;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .top-bar .right-section .btn:hover {
            border-color: var(--accent-green);
            color: #fff;
        }
        .top-bar .right-section .btn-primary {
            background: var(--accent-green);
            border-color: var(--accent-green);
            color: #fff;
        }
        .top-bar .right-section .btn-primary:hover {
            background: var(--accent-green-dark);
        }
        .top-bar .right-section .memory-btn {
            background: rgba(16, 163, 127, 0.1);
            border-color: var(--accent-green);
            color: var(--accent-green);
        }
        .top-bar .right-section .memory-btn:hover {
            background: rgba(16, 163, 127, 0.2);
        }

        /* ===== CHAT ===== */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .chat-messages .empty {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }
        .chat-messages .empty .icon {
            font-size: 48px;
            margin-bottom: 16px;
        }
        .chat-messages .empty h2 {
            color: #fff;
            font-size: 20px;
            margin-bottom: 6px;
        }
        .chat-messages .empty p {
            font-size: 14px;
        }
        .chat-messages .empty .sub {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .msg {
            max-width: 85%;
            padding: 10px 16px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.7;
            animation: fadeUp 0.3s ease;
            position: relative;
            word-break: break-word;
        }
        .msg.user {
            align-self: flex-end;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-bottom-right-radius: 4px;
        }
        .msg.assistant {
            align-self: flex-start;
            background: transparent;
            border-bottom-left-radius: 4px;
            padding-right: 0;
        }
        .msg .time {
            font-size: 10px;
            color: var(--text-muted);
            display: block;
            margin-top: 6px;
        }
        .msg .copy-btn {
            position: absolute;
            top: 4px;
            right: 10px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 12px;
            opacity: 0;
            transition: 0.3s;
        }
        .msg:hover .copy-btn {
            opacity: 1;
        }
        .msg .copy-btn:hover {
            color: #fff;
        }
        .msg .streaming-cursor {
            display: inline-block;
            width: 2px;
            height: 16px;
            background: var(--accent-green);
            animation: blink 0.8s infinite;
            vertical-align: middle;
            margin-right: 2px;
        }
        .msg pre {
            background: #0d1117;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            overflow-x: auto;
            margin: 6px 0;
            font-size: 13px;
            font-family: 'Courier New', monospace;
        }
        .msg code {
            background: #0d1117;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 13px;
            font-family: 'Courier New', monospace;
        }
        .msg ul,
        .msg ol {
            padding-right: 20px;
            margin: 6px 0;
        }
        .msg a {
            color: var(--accent-green);
            text-decoration: none;
        }
        .msg a:hover {
            text-decoration: underline;
        }
        .msg img {
            max-width: 100%;
            border-radius: 8px;
            margin: 6px 0;
        }

        @keyframes blink {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0;
            }
        }
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== TYPING ===== */
        .typing-indicator {
            align-self: flex-start;
            padding: 10px 0;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .typing-indicator .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-muted);
            animation: typingDot 1.2s infinite;
        }
        .typing-indicator .dot:nth-child(2) {
            animation-delay: 0.2s;
        }
        .typing-indicator .dot:nth-child(3) {
            animation-delay: 0.4s;
        }
        @keyframes typingDot {
            0%,
            60%,
            100% {
                transform: translateY(0);
                opacity: 0.3;
            }
            30% {
                transform: translateY(-8px);
                opacity: 1;
            }
        }

        /* ============================================================
           INPUT
           ============================================================ */
        .input-area {
            background: var(--bg-secondary);
            padding: 8px 16px 14px;
            border-top: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .input-toolbar {
            display: flex;
            gap: 4px;
            margin-bottom: 6px;
            flex-wrap: wrap;
        }
        .input-toolbar button {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 3px 12px;
            border-radius: 14px;
            font-size: 11px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .input-toolbar button:hover {
            border-color: var(--accent-green);
            color: #fff;
        }
        .input-toolbar button.active {
            border-color: var(--accent-green);
            background: var(--accent-green);
            color: #fff;
        }

        .input-row {
            display: flex;
            gap: 8px;
            align-items: flex-end;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 4px 6px;
            transition: 0.3s;
        }
        .input-row:focus-within {
            border-color: var(--accent-green);
            box-shadow: 0 0 0 3px rgba(16, 163, 127, 0.12);
        }
        .input-row textarea {
            flex: 1;
            background: transparent;
            border: none;
            padding: 8px 12px;
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            resize: none;
            font-family: inherit;
            min-height: 24px;
            max-height: 120px;
            line-height: 1.5;
        }
        .input-row textarea::placeholder {
            color: var(--text-muted);
        }
        .input-row .action-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 18px;
            cursor: pointer;
            padding: 6px 8px;
            border-radius: 50%;
            transition: 0.3s;
            flex-shrink: 0;
        }
        .input-row .action-btn:hover {
            color: #fff;
            background: var(--bg-hover);
        }
        .input-row .send-btn {
            background: var(--accent-green);
            border: none;
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            flex-shrink: 0;
        }
        .input-row .send-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 0 20px rgba(16, 163, 127, 0.3);
        }
        .input-row .send-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* ===== FILE PREVIEW ===== */
        .file-preview {
            display: none;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 6px 12px;
            margin-bottom: 6px;
            align-items: center;
            gap: 10px;
        }
        .file-preview.show {
            display: flex;
        }
        .file-preview .file-name {
            font-size: 13px;
            color: var(--text-secondary);
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .file-preview .file-size {
            font-size: 11px;
            color: var(--text-muted);
        }
        .file-preview .remove-file {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 16px;
        }
        .file-preview .remove-file:hover {
            color: #ef4444;
        }

        .input-bottom {
            display: flex;
            justify-content: space-between;
            padding: 4px 4px 0;
            font-size: 11px;
            color: var(--text-muted);
            flex-wrap: wrap;
            gap: 4px;
        }
        .input-bottom .left {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }
        .input-bottom .left button {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 11px;
            cursor: pointer;
            padding: 2px 8px;
            border-radius: 10px;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .input-bottom .left button:hover {
            color: #fff;
            background: var(--bg-hover);
        }
        .input-bottom .status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
        }
        .input-bottom .status .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            display: inline-block;
        }
        .input-bottom .status .dot.online {
            background: var(--accent-green);
        }
        .input-bottom .status .dot.offline {
            background: var(--text-muted);
        }
        .input-bottom .status .dot.loading {
            background: #eab308;
            animation: pulse 0.8s infinite;
        }
        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.3;
            }
        }

        /* ============================================================
           MODAL
           ============================================================ */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }
        .modal.open {
            display: flex;
        }
        .modal-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 24px;
            width: 92%;
            max-width: 440px;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-card .close-btn {
            float: left;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 22px;
            cursor: pointer;
        }
        .modal-card .close-btn:hover {
            color: #fff;
        }
        .modal-card h3 {
            margin-bottom: 16px;
            font-size: 18px;
            color: #fff;
        }
        .modal-card label {
            display: block;
            margin: 12px 0 4px;
            font-size: 13px;
            color: var(--text-secondary);
        }
        .modal-card input,
        .modal-card select {
            width: 100%;
            padding: 8px 12px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
        }
        .modal-card input:focus,
        .modal-card select:focus {
            border-color: var(--accent-green);
        }
        .modal-card .btn {
            width: 100%;
            margin-top: 12px;
            padding: 10px;
            border: none;
            border-radius: 12px;
            background: var(--accent-green);
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }
        .modal-card .btn:hover {
            transform: scale(1.02);
        }
        .modal-card .btn-secondary {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            margin-top: 6px;
        }
        .modal-card .key-status {
            font-size: 12px;
            padding: 4px 12px;
            border-radius: 10px;
            margin-top: 8px;
            display: inline-block;
        }
        .modal-card .key-status.valid {
            background: #22c55e22;
            color: #22c55e;
            border: 1px solid #22c55e44;
        }
        .modal-card .key-status.invalid {
            background: #ef444422;
            color: #ef4444;
            border: 1px solid #ef444444;
        }

        /* ============================================================
           TOAST
           ============================================================ */
        .toast {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 6px 16px;
            border-radius: 10px;
            font-size: 13px;
            z-index: 9999;
            animation: fadeUp 0.3s ease;
            max-width: 90%;
            text-align: center;
        }

        /* ============================================================
           OVERLAY
           ============================================================ */
        .sidebar-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
            display: none;
        }
        .sidebar-overlay.open {
            display: block;
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                top: 0;
                right: -300px;
                width: 290px;
                height: 100vh;
                z-index: 1000;
                box-shadow: var(--shadow);
            }
            .sidebar.open {
                right: 0;
            }
            .top-bar .left-section .mobile-menu-btn {
                display: block;
            }
            .chat-messages {
                padding: 12px 16px;
            }
            .msg {
                max-width: 92%;
                font-size: 13px;
            }
            .input-area {
                padding: 6px 12px 10px;
            }
            .input-row textarea {
                font-size: 13px;
                padding: 6px 10px;
            }
            .input-row .send-btn {
                padding: 6px 14px;
                font-size: 13px;
            }
            .top-bar .right-section .btn {
                font-size: 10px;
                padding: 3px 8px;
            }
            .top-bar .right-section .btn span {
                display: none;
            }
        }

        @media (max-width: 480px) {
            .sidebar {
                width: 250px;
                right: -260px;
            }
            .chat-messages .empty .icon {
                font-size: 36px;
            }
            .chat-messages .empty h2 {
                font-size: 17px;

                font-size: 10px;
                padding: 1px 6px;
            }
            .input-toolbar button {
                font-size: 10px;
                padding: 2px 8px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== MAIN ===== -->
    <div class="main-area">

        <!-- TOP BAR -->
        <div class="top-bar">

                <p>بنویس، ویرایش کن، جستجوی وب کن، تصویر بساز</p>

        <!-- INPUT -->
        <div class="input-area">

            <div class="file-preview" id="filePreview">
                <span class="file-name" id="fileName">file.txt</span>
                <span class="file-size" id="fileSize">0 KB</span>

            <div class="input-toolbar">
                <button onclick="toggleThink()" id="thinkBtn">🧠 Think</button>
                <button onclick="toggleCodeMode()" id="codeBtn">💻 Code</button>
                <button onclick="toggleSearch()" id="searchBtn">🔍 Search</button>
                <button onclick="toggleImageMode()" id="imageBtn">🎨 Image</button>
            </div>

            <div class="input-row">
                <button class="action-btn" onclick="document.getElementById('fileInput').click()">📎</button>
                <input type="file" id="fileInput" style="display:none" onchange="handleFile(event)" multiple />
                <button class="action-btn" onclick="toggleVoice()">🎤</button>
                <textarea id="chatInput" rows="1" placeholder="چی بپرسیم؟"></textarea>

            </div>

            <div class="input-bottom">
                <div class="left">
                    <button onclick="sendQuick('یک تصویر از منظره زیبا بساز')">🖼️ تصویر</button>
                    <button onclick="sendQuick('یک داستان کوتاه بنویس')">✏️ بنویس</button>
                    <button onclick="sendQuick('جستجو کن درباره هوش مصنوعی')">🔍 جستجو</button>
                    <button onclick="sendQuick('کد پایتون بنویس')">💻 کد</button>

                <div class="status">
                    <span class="dot offline" id="statusDot"></span>

    <!-- ===== SETTINGS MODAL ===== -->
    <div class="modal" id="settingsModal">
        <div class="modal-card">
            <button class="close-btn" onclick="closeSettings()">✕</button>
            <h3>⚙️ تنظیمات پیشرفته</h3>

            <label>👤 نام کاربری</label>
            <input type="text" id="usernameInput" placeholder="نام خود را وارد کنید" />

            <label>🔑 کلید API (OpenAI / DeepSeek)</label>
            <input type="password" id="apiKeyInput" placeholder="sk-... کلید خود را وارد کنید" />
            <div id="keyStatus"></div>

            <label>📡 آدرس API</label>
            <input type="text" id="apiUrlInput" value="https://api.openai.com/v1/chat/completions" />

            <label>🧠 مدل</label>
            <select id="modelSelect">
                <option value="gpt-3.5-turbo">GPT-3.5 Turbo</option>
                <option value="gpt-4">GPT-4</option>
                <option value="gpt-4o">GPT-4o</option>
                <option value="deepseek-chat">DeepSeek Chat</option>
                <option value="deepseek-coder">DeepSeek Coder</option>
            </select>

            <label>🌡️ خلاقیت (۰ تا ۲)</label>
            <input type="number" id="tempInput" value="0.7" min="0" max="2" step="0.1" />

            <label>📏 حداکثر توکن</label>
            <input type="number" id="maxTokensInput" value="500" min="50" max="4096" step="50" />

            <label>📂 ذخیره‌سازی ابری</label>
            <select id="cloudStorage">
                <option value="local">فقط محلی</option>
                <option value="cloud">ابر (پرداخت)</option>
            </select>

            <button class="btn" onclick="saveSettings()">💾 ذخیره</button>
            <button class="btn btn-secondary" onclick="testConnection()">🔍 تست اتصال</button>
            <button class="btn btn-secondary" onclick="clearAllData()">🗑️ پاک کردن همه داده‌ها</button>
        </div>
    </div>

    <!-- ===== IMAGE GENERATOR MODAL ===== -->
    <div class="modal" id="imageModal">
        <div class="modal-card">
            <button class="close-btn" onclick="closeImageGenerator()">✕</button>
            <h3>🎨 تولید تصویر</h3>
            <label>توضیح تصویر</label>
            <input type="text" id="imagePromptInput" placeholder="یک منظره زیبا از غروب..." />
            <label>ابعاد</label>
            <select id="imageSize">
                <option value="512x512">512×512</option>
                <option value="1024x1024">1024×1024</option>
                <option value="1792x1024">1792×1024</option>
            </select>
            <button class="btn" onclick="generateImage()">🎨 تولید کن</button>
            <div id="imageResult" style="margin-top:12px;text-align:center;"></div>
        </div>
    </div>

    <script>
        // ================================================================
        //  🤖 AI Chat Pro - نسخه کامل با همه امکانات
        //  این یک کلون کامل از ChatGPT است، نه سورس رسمی
        // ================================================================

        // ===== STATE =====
        const chatMessages = document.getElementById('chatMessages');
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');

        let currentChat = [];
        let allChats = [];
        let currentChatId = null;
        let isProcessing = false;
        let isListening = false;
        let recognition = null;
        let selectedFiles = [];
        let memoryEnabled = false;
        let webSearchEnabled = false;
        let thinkEnabled = false;
        let codeModeEnabled = false;
        let searchEnabled = false;
        let imageModeEnabled = false;
        let username = 'کاربر مهمان';
        let messageCount = 0;
        const MAX_FREE_MESSAGES = 10;

        // ===== CONFIG =====
        let config = {
            apiKey: '',
            apiUrl: 'https://api.openai.com/v1/chat/completions',
            model: 'gpt-3.5-turbo',
            temperature: 0.7,
            maxTokens: 500,
            cloudStorage: 'local'
        };

        // ===== LOAD / SAVE =====
        function loadData() {
            try {
                const savedChats = localStorage.getItem('aichatpro_chats');
                if (savedChats) allChats = JSON.parse(savedChats);
                const savedConfig = localStorage.getItem('aichatpro_config');
                if (savedConfig) config = { ...config, ...JSON.parse(savedConfig) };
                const savedMemory = localStorage.getItem('aichatpro_memory');
                if (savedMemory) memoryEnabled = JSON.parse(savedMemory);
                const savedUsername = localStorage.getItem('aichatpro_username');
                if (savedUsername) username = savedUsername;
                const savedCount = localStorage.getItem('aichatpro_count');
                if (savedCount) messageCount = parseInt(savedCount);

                if (allChats.length === 0) {
                    newChat();
                } else {
                    currentChatId = allChats[0].id;
                    currentChat = allChats[0].messages;
                }
            } catch (e) { /* ignore */ }
        }

        function saveData() {
            try {
                localStorage.setItem('aichatpro_chats', JSON.stringify(allChats));
                localStorage.setItem('aichatpro_config', JSON.stringify(config));
                localStorage.setItem('aichatpro_memory', JSON.stringify(memoryEnabled));
                localStorage.setItem('aichatpro_username', username);
                localStorage.setItem('aichatpro_count', String(messageCount));
            } catch (e) { /* ignore */ }
        }

        // ===== CHAT MANAGEMENT =====
        function newChat() {
            const id = 'chat_' + Date.now();
            allChats.unshift({ id, messages: [], created: new Date().toISOString() });
            currentChatId = id;
            currentChat = [];
            renderChatHistory();
            renderMessages();
            saveData();
            if (window.innerWidth < 768) toggleSidebar();
            chatInput.focus();
            document.getElementById('chatTitle').textContent = 'AI Chat Pro';
        }

        function switchChat(id) {
            const chat = allChats.find(c => c.id === id);
            if (!chat) return;
            currentChatId = id;
            currentChat = chat.messages;
            renderChatHistory();
            renderMessages();
            saveData();
            if (window.innerWidth < 768) toggleSidebar();
            document.getElementById('chatTitle').textContent = chat.messages.length > 0 ?
                chat.messages[0].content.substring(0, 25) + '...' :
                'AI Chat Pro';
        }

        function deleteChat(id) {
            if (allChats.length <= 1) {
                showToast('❌ حداقل یک چت باید داشته باشی!');
                return;
            }
            if (!confirm('این چت حذف بشه؟')) return;
            allChats = allChats.filter(c => c.id !== id);
            if (currentChatId === id) {
                currentChatId = allChats[0].id;
                currentChat = allChats[0].messages;
            }
            renderChatHistory();
            renderMessages();
            saveData();
        }

        function clearAllChats() {
            if (allChats.length === 0) return;
            if (!confirm('همه چت‌ها پاک بشن؟')) return;
            allChats = [];
            newChat();
            saveData();
        }

        // ===== RENDER =====
        function renderChatHistory() {
            const container = document.getElementById('chatHistory');
            container.innerHTML = '';
            allChats.forEach(chat => {
                const div = document.createElement('div');
                div.className = `history-item ${chat.id === currentChatId ? 'active' : ''}`;
                const name = chat.messages.length > 0 ?
                    chat.messages[0].content.substring(0, 25) + (chat.messages[0].content.length > 25 ? '...' : '') :
                    'چت جدید';
                div.innerHTML = `
                    <span>${name}</span>
                    <button class="delete-btn" onclick="event.stopPropagation();deleteChat('${chat.id}')">✕</button>
                `;
                div.onclick = () => switchChat(chat.id);
                container.appendChild(div);
            });
        }

        function renderMessages() {
            if (currentChat.length === 0) {
                chatMessages.innerHTML = `
                    <div class="empty">
                        <div class="icon">🤖</div>
                        <h2>چی بپرسیم؟</h2>
                        <p>بنویس، ویرایش کن، جستجوی وب کن، تصویر بساز</p>
                        <p class="sub">یک پیام بنویس تا شروع کنی</p>
                    </div>
                `;
                return;
            }
            chatMessages.innerHTML = '';
            currentChat.forEach((msg, index) => {
                const div = document.createElement('div');
                div.className = `msg ${msg.role}`;
                let content = msg.content;
                if (msg.role === 'assistant') {
                    content = renderMarkdown(content);
                }
                if (msg.image && msg.role === 'assistant') {
                    content += `<br><img src="${msg.image}" alt="Generated Image" style="max-width:100%;border-radius:8px;margin-top:6px;" />`;
                }
                div.innerHTML = `
                    ${content}
                    <span class="time">${msg.time || ''}</span>
                    <button class="copy-btn" onclick="copyMessage(${index})">📋</button>
                `;
                chatMessages.appendChild(div);
            });
            chatMessages.scrollTop = chatMessages.scrollHeight;
            document.getElementById('countBadge').textContent = currentChat.length;
            updateUserPlan();
        }

        // ===== MARKDOWN =====
        function renderMarkdown(text) {
            let html = text;
            html = html.replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>');
            html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
            html = html.replace(/^[-*]\s(.+)$/gm, '• $1');
            html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
            html = html.replace(/\n/g, '<br>');
            return html;
        }

        // ===== COPY =====
        function copyMessage(index) {
            const text = currentChat[index].content;
            if (navigator.clipboard) {
                navigator.clipboard.writeText(text);
            } else {
                const ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                ta.remove();
            }
            showToast('📋 کپی شد!');
        }

        // ===== USER PLAN =====
        function updateUserPlan() {
            const remaining = MAX_FREE_MESSAGES - messageCount;
            const plan = document.querySelector('.plan');
            if (remaining <= 0) {
                plan.innerHTML = '<span class="badge" style="background:#ef4444;">محدود</span> • پیام تمام شد';
            } else {
                plan.innerHTML = `<span class="badge">رایگان</span> • ${remaining} پیام`;
            }
        }

        // ===== SEND =====
        async function sendMessage() {
            if (isProcessing) return;

            // چک کردن محدودیت
            if (messageCount >= MAX_FREE_MESSAGES && !config.apiKey) {
                showToast('❌ پیام‌های رایگان تمام شد! کلید API را وارد کن یا اشتراک تهیه کن.');
                return;
            }

            const text = chatInput.value.trim();
            if (!text && selectedFiles.length === 0) return;

            isProcessing = true;
            sendBtn.disabled = true;
            setStatus('loading', 'در حال فکر...');

            let content = text;
            if (selectedFiles.length > 0) {
                const fileNames = selectedFiles.map(f => f.name).join(', ');
                content = `[📎 ${fileNames}]\n${text || 'بررسی کن'}`;
                selectedFiles = [];
                document.getElementById('filePreview').classList.remove('show');
            }

            // اضافه کردن حالت‌ها
            let modeText = '';
            if (thinkEnabled) modeText += ' [🧠 Think Mode]';
            if (codeModeEnabled) modeText += ' [💻 Code Mode]';
            if (searchEnabled) modeText += ' [🔍 Search Mode]';
            if (imageModeEnabled) modeText += ' [🎨 Image Mode]';

            if (modeText) content += modeText;

            currentChat.push({ role: 'user', content: content, time: new Date().toLocaleTimeString() });
            messageCount++;
            const chat = allChats.find(c => c.id === currentChatId);
            if (chat) chat.messages = currentChat;
            chatInput.value = '';
            chatInput.style.height = 'auto';
            renderMessages();
            saveData();
            renderChatHistory();
            document.getElementById('chatTitle').textContent = content.substring(0, 25) + '...';
            showTyping();

            try {
                let reply = '';
                let imageResult = null;

                // حالت تصویر
                if (imageModeEnabled && (text.includes('تصویر') || text.includes('عکس') || text.includes('طرح') || text.includes('بساز'))) {
                    imageResult = await generateImageAPI(text);
                }

                // پاسخ معمولی
                if (config.apiKey && config.apiKey.length > 10) {
                    reply = await callAPI(content);
                } else {
                    reply = generateLocalReply(content);
                }

                hideTyping();
                await streamReply(reply);

                const msgData = { role: 'assistant', content: reply, time: new Date().toLocaleTimeString() };
                if (imageResult) {
                    msgData.image = imageResult;
                }
                currentChat.push(msgData);
                const chat2 = allChats.find(c => c.id === currentChatId);
                if (chat2) chat2.messages = currentChat;
                renderMessages();
                saveData();
                renderChatHistory();
                setStatus('online', 'آنلاین');
            } catch (err) {
                hideTyping();
                setStatus('offline', 'خطا');
                currentChat.push({ role: 'assistant', content: `❌ ${err.message}`, time: new Date().toLocaleTimeString() });
                const chat3 = allChats.find(c => c.id === currentChatId);
                if (chat3) chat3.messages = currentChat;
                renderMessages();
                saveData();
                renderChatHistory();
            }

            isProcessing = false;
            sendBtn.disabled = false;
            chatInput.focus();
        }

        // ===== STREAM =====
        async function streamReply(text) {
            const words = text.split(' ');
            let currentText = '';
            const div = document.createElement('div');
            div.className = 'msg assistant';
            div.innerHTML = `<span class="streaming-cursor"></span>`;
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            for (let i = 0; i < words.length; i++) {
                currentText += words[i] + ' ';
                div.innerHTML = renderMarkdown(currentText) + `<span class="streaming-cursor"></span>`;
                chatMessages.scrollTop = chatMessages.scrollHeight;
                await sleep(15 + Math.random() * 30);
            }
            div.innerHTML = renderMarkdown(currentText);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

        // ===== API =====
        async function callAPI(text) {
            const history = currentChat.slice(-10).map(m => ({
                role: m.role === 'user' ? 'user' : 'assistant',
                content: m.content
            }));

            let systemPrompt = 'You are a helpful AI assistant. Respond in Persian.';
            if (thinkEnabled) systemPrompt += ' Use deep reasoning.';
            if (codeModeEnabled) systemPrompt += ' Provide code examples.';
            if (searchEnabled) systemPrompt += ' Use search for current information.';
            if (imageModeEnabled) systemPrompt += ' You can describe images for generation.';

            const response = await fetch(config.apiUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${config.apiKey}`
                },
                body: JSON.stringify({
                    model: config.model,
                    messages: [
                        { role: 'system', content: systemPrompt },
                        ...history
                    ],
                    temperature: parseFloat(config.temperature),
                    max_tokens: parseInt(config.maxTokens)
                })
            });

            if (!response.ok) {
                const error = await response.text();
                throw new Error(`HTTP ${response.status}: ${error}`);
            }

            const data = await response.json();
            return data.choices?.[0]?.message?.content || 'No response';
        }

        // ===== IMAGE GENERATION =====
        async function generateImageAPI(prompt) {
            if (!config.apiKey) return null;
            try {
                const response = await fetch('https://api.openai.com/v1/images/generations', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${config.apiKey}`
                    },
                    body: JSON.stringify({
                        prompt: prompt,
                        n: 1,
                        size: '512x512'
                    })
                });
                if (!response.ok) return null;
                const data = await response.json();
                return data.data?.[0]?.url || null;
            } catch (e) {
                return null;
            }
        }

        // ===== LOCAL =====
        function generateLocalReply(text) {
            const lower = text.toLowerCase();
            const responses = {
                'سلام': '👋 سلام! من AI Chat Pro هستم. چطور میتونم کمکت کنم؟',
                'چه خبر': '😊 همه چی خوب! تو چطوری؟',
                'لطیفه': '😂 یه لطیفه: چرا برنامه‌نویس‌ها خونه نمی‌رن؟ چون خونه‌شون localhost هست!',
                'کد': '💻 کد پایتون:\n```python\ndef hello():\n    print("سلام!")\n```',
                'هوش مصنوعی': '🧠 هوش مصنوعی یعنی ماشین‌هایی که مثل انسان فکر میکنن!',
                'تصویر': '🖼️ می‌تونی از من بخوای یه تصویر بسازم. مثلاً: "یک منظره زیبا"',
                'جستجو': '🔍 می‌تونی از من سوال بپرسی و من جستجو کنم!'
            };
            for (const [key, value] of Object.entries(responses)) {
                if (lower.includes(key)) return value;
            }
            return '🤔 جالب! بیشتر برام بگو...';
        }

        // ===== TYPING =====
        function showTyping() {
            const div = document.createElement('div');
            div.className = 'typing-indicator';
            div.id = 'typingIndicator';
            div.innerHTML = `<span class="dot"></span><span class="dot"></span><span class="dot"></span>`;
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function hideTyping() {
            const el = document.getElementById('typingIndicator');
            if (el) el.remove();
        }

        // ===== VOICE =====
        function initVoice() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                document.querySelector('.input-row .action-btn:nth-child(2)').style.display = 'none';
                return;
            }
            recognition = new SpeechRecognition();
            recognition.lang = 'fa-IR';
            recognition.continuous = false;
            recognition.interimResults = true;

            recognition.onresult = function(event) {
                let final = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    if (event.results[i].isFinal) {
                        final += event.results[i][0].transcript;
                    }
                }
                if (final) {
                    chatInput.value = final;
                    chatInput.style.height = 'auto';
                    sendMessage();
                }
            };

            recognition.onerror = function() {
                document.querySelector('.input-row .action-btn:nth-child(2)').classList.remove('listening');
            };
        }

        function toggleVoice() {
            if (!recognition) {
                showToast('❌ Voice not supported');
                return;
            }
            if (isListening) {
                recognition.stop();
                isListening = false;
                document.querySelector('.input-row .action-btn:nth-child(2)').classList.remove('listening');
            } else {
                recognition.start();
                isListening = true;
                document.querySelector('.input-row .action-btn:nth-child(2)').classList.add('listening');
            }
        }

        // ===== FILE =====
        function handleFile(event) {
            const files = event.target.files;
            if (!files.length) return;
            for (let file of files) {
                selectedFiles.push(file);
            }
            const preview = document.getElementById('filePreview');
            preview.classList.add('show');
            const names = selectedFiles.map(f => f.name).join(', ');
            document.getElementById('fileName').textContent = names;
            const totalSize = selectedFiles.reduce((sum, f) => sum + f.size, 0);
            document.getElementById('fileSize').textContent = (totalSize / 1024).toFixed(1) + ' KB';
            event.target.value = '';
        }

        function removeFile() {
            selectedFiles = [];
            document.getElementById('filePreview').classList.remove('show');
        }

        // ===== TOGGLES =====
        function toggleMemory() {
            memoryEnabled = !memoryEnabled;
            const btn = document.querySelector('.memory-btn');
            btn.querySelector('span').textContent = memoryEnabled ? 'on' : 'off';
            btn.style.borderColor = memoryEnabled ? 'var(--accent-green)' : 'var(--border-color)';
            btn.style.color = memoryEnabled ? 'var(--accent-green)' : 'var(--text-secondary)';
            saveData();
            showToast(memoryEnabled ? '🧠 Memory فعال شد' : '🧠 Memory غیرفعال شد');
        }

        function toggleWebSearch() {
            webSearchEnabled = !webSearchEnabled;
            const btns = document.querySelectorAll('.top-bar .right-section .btn');
            const webBtn = btns[2];
            webBtn.style.borderColor = webSearchEnabled ? 'var(--accent-green)' : 'var(--border-color)';
            webBtn.style.color = webSearchEnabled ? 'var(--accent-green)' : 'var(--text-secondary)';
            showToast(webSearchEnabled ? '🌐 Web Search فعال شد' : '🌐 Web Search غیرفعال شد');
        }

        function toggleThink() {
            thinkEnabled = !thinkEnabled;
            document.getElementById('thinkBtn').classList.toggle('active');
            showToast(thinkEnabled ? '🧠 Think فعال شد' : '🧠 Think غیرفعال شد');
        }

        function toggleCodeMode() {
            codeModeEnabled = !codeModeEnabled;
            document.getElementById('codeBtn').classList.toggle('active');
            showToast(codeModeEnabled ? '💻 Code Mode فعال شد' : '💻 Code Mode غیرفعال شد');
        }

        function toggleSearch() {
            searchEnabled = !searchEnabled;
            document.getElementById('searchBtn').classList.toggle('active');
            showToast(searchEnabled ? '🔍 Search فعال شد' : '🔍 Search غیرفعال شد');
        }

        function toggleImageMode() {
            imageModeEnabled = !imageModeEnabled;
            document.getElementById('imageBtn').classList.toggle('active');
            showToast(imageModeEnabled ? '🎨 Image Mode فعال شد' : '🎨 Image Mode غیرفعال شد');
            if (imageModeEnabled) {
                openImageGenerator();
            }
        }

        // ===== SIDEBAR =====
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('sidebarOverlay').classList.toggle('open');
        }

        // ===== SETTINGS =====
        function openSettings() {
            document.getElementById('settingsModal').classList.add('open');
            document.getElementById('usernameInput').value = username;
            document.getElementById('apiKeyInput').value = config.apiKey;
            document.getElementById('apiUrlInput').value = config.apiUrl;
            document.getElementById('modelSelect').value = config.model;
            document.getElementById('tempInput').value = config.temperature;
            document.getElementById('maxTokensInput').value = config.maxTokens;
            document.getElementById('cloudStorage').value = config.cloudStorage || 'local';
            if (config.apiKey) {
                showKeyStatus('valid', '✅ کلید ذخیره شده');
            }
            document.getElementById('userName').textContent = username;
            document.getElementById('userAvatar').textContent = username.charAt(0).toUpperCase();
        }

        function closeSettings() {
            document.getElementById('settingsModal').classList.remove('open');
        }

        function saveSettings() {
            username = document.getElementById('usernameInput').value.trim() || 'کاربر مهمان';
            config.apiKey = document.getElementById('apiKeyInput').value.trim();
            config.apiUrl = document.getElementById('apiUrlInput').value.trim() || config.apiUrl;
            config.model = document.getElementById('modelSelect').value;
            config.temperature = parseFloat(document.getElementById('tempInput').value) || 0.7;
            config.maxTokens = parseInt(document.getElementById('maxTokensInput').value) || 500;
            config.cloudStorage = document.getElementById('cloudStorage').value;

            saveData();
            closeSettings();

            document.getElementById('userName').textContent = username;
            document.getElementById('userAvatar').textContent = username.charAt(0).toUpperCase();

            if (config.apiKey) {
                setStatus('online', 'آنلاین');
                testConnection();
            } else {
                setStatus('offline', 'آفلاین');
            }
            showToast('✅ تنظیمات ذخیره شد');
        }

        // ===== TEST =====
        async function testConnection() {
            const key = document.getElementById('apiKeyInput').value.trim();
            if (!key || key.length < 10) {
                showKeyStatus('invalid', '❌ کلید نامعتبر');
                return;
            }
            showKeyStatus('loading', '⏳ در حال تست...');
            try {
                const resp = await fetch('https://api.openai.com/v1/models', {
                    headers: { 'Authorization': `Bearer ${key}` }
                });
                if (resp.ok) {
                    showKeyStatus('valid', '✅ اتصال برقرار است!');
                } else if (resp.status === 401) {
                    showKeyStatus('invalid', '❌ کلید نامعتبر (401)');
                } else {
                    showKeyStatus('invalid', `⚠️ وضعیت: ${resp.status}`);
                }
            } catch (e) {
                showKeyStatus('invalid', '❌ خطا: ' + e.message);
            }
        }

        function showKeyStatus(type, msg) {
            const el = document.getElementById('keyStatus');
            if (!msg) { el.innerHTML = ''; return; }
            el.innerHTML = `<span class="key-status ${type}">${msg}</span>`;
        }

        // ===== IMAGE GENERATOR =====
        function openImageGenerator() {
            document.getElementById('imageModal').classList.add('open');
        }

        function closeImageGenerator() {
            document.getElementById('imageModal').classList.remove('open');
        }

        async function generateImage() {
            const prompt = document.getElementById('imagePromptInput').value.trim();
            if (!prompt) {
                showToast('❌ توضیح تصویر را وارد کن');
                return;
            }
            if (!config.apiKey) {
                showToast('❌ برای تولید تصویر به کلید API نیاز داری');
                return;
            }

            const result = document.getElementById('imageResult');
            result.innerHTML = '⏳ در حال تولید...';

            try {
                const size = document.getElementById('imageSize').value;
                const response = await fetch('https://api.openai.com/v1/images/generations', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${config.apiKey}`
                    },
                    body: JSON.stringify({
                        prompt: prompt,
                        n: 1,
                        size: size
                    })
                });

                if (!response.ok) {
                    const error = await response.text();
                    throw new Error(`HTTP ${response.status}: ${error}`);
                }

                const data = await response.json();
                const imageUrl = data.data?.[0]?.url;
                if (imageUrl) {
                    result.innerHTML = `
                        <img src="${imageUrl}" style="max-width:100%;border-radius:12px;border:1px solid var(--border-color);" />
                        <br><br>
                        <button onclick="window.open('${imageUrl}','_blank')" style="background:var(--accent-green);border:none;color:#fff;padding:6px 16px;border-radius:8px;cursor:pointer;">🔗 باز کردن</button>
                    `;
                    showToast('✅ تصویر تولید شد!');
                } else {
                    result.innerHTML = '❌ تصویری تولید نشد';
                }
            } catch (e) {
                result.innerHTML = `❌ خطا: ${e.message}`;
            }
        }

        // ===== STATUS =====
        function setStatus(state, text) {
            const dot = document.getElementById('statusDot');
            const label = document.getElementById('statusText');
            dot.className = 'dot ' + state;
            label.textContent = text;
        }

        // ===== QUICK =====
        function sendQuick(text) {
            chatInput.value = text;
            chatInput.style.height = 'auto';
            sendMessage();
        }

        // ===== PLUS =====
        function getPlus() {
            showToast('⭐ اشتراک ویژه - پیام نامحدود، تصویر، وب، فایل');
        }

        // ===== EXPORT =====
        function exportAllChats() {
            if (allChats.length === 0) {
                showToast('❌ چتی برای خروجی نیست');
                return;
            }
            const data = JSON.stringify(allChats, null, 2);
            const blob = new Blob([data], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `all_chats_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('📤 همه چت‌ها خروجی گرفته شد!');
        }

        // ===== CLEAR ALL DATA =====
        function clearAllData() {
            if (!confirm('همه داده‌ها (چت‌ها، تنظیمات، حافظه) پاک بشن؟')) return;
            localStorage.clear();
            location.reload();
        }

        // ===== SHOW FUNCTIONS =====
        function showLibrary() { showToast('📚 کتابخانه: چت‌های ذخیره شده'); }
        function showProjects() { showToast('📁 پروژه‌ها: در حال توسعه'); }
        function showPlugins() { showToast('🔌 افزونه‌ها: به زودی'); }

        // ===== TOAST =====
        function showToast(msg) {
            const old = document.querySelector('.toast');
            if (old) old.remove();
            const div = document.createElement('div');
            div.className = 'toast';
            div.textContent = msg;
            document.body.appendChild(div);
            setTimeout(() => div.remove(), 2500);
        }

        // ===== EVENTS =====
        sendBtn.addEventListener('click', sendMessage);
        chatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
        chatInput.addEventListener('input', () => {
            chatInput.style.height = 'auto';
            chatInput.style.height = Math.min(chatInput.scrollHeight, 120) + 'px';
        });

        document.getElementById('settingsModal').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) closeSettings();
        });

        document.getElementById('imageModal').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) closeImageGenerator();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                if (document.getElementById('settingsModal').classList.contains('open')) {
                    closeSettings();
                }
                if (document.getElementById('imageModal').classList.contains('open')) {
                    closeImageGenerator();
                }
            }
        });

        // ===== INIT =====
        loadData();
        renderMessages();
        renderChatHistory();
        initVoice();

        document.getElementById('userName').textContent = username;
        document.getElementById('userAvatar').textContent = username.charAt(0).toUpperCase();

        if (config.apiKey) {
            setStatus('online', 'آنلاین');
        } else {
            setStatus('offline', 'آفلاین');
            showToast('💡 کلید API را در تنظیمات وارد کنید');
        }

        updateUserPlan();

        const memoryBtn = document.querySelector('.memory-btn');
        memoryBtn.querySelector('span').textContent = memoryEnabled ? 'on' : 'off';
        memoryBtn.style.borderColor = memoryEnabled ? 'var(--accent-green)' : 'var(--border-color)';
        memoryBtn.style.color = memoryEnabled ? 'var(--accent-green)' : 'var(--text-secondary)';

        console.log('🤖 AI Chat Pro - نسخه کامل');
        console.log(`🔑 API: ${config.apiKey ? '✅ دارد' : '❌ ندارد'}`);
        console.log(`💾 ${allChats.length} چت`);
        console.log(`📝 ${messageCount} پیام استفاده شده`);
        console.log(`🧠 Memory: ${memoryEnabled ? 'ON' : 'OFF'}`);
        console.log(`👤 کاربر: ${username}`);
        console.log('🎤 Voice: ' + ('webkitSpeechRecognition' in window ? '✅' : '❌'));
        console.log('📦 این یک کلون کامل از ChatGPT است، نه سورس رسمی');
        console.log('⚡ همه امکانات: تصویر، وب، فایل، کد، حافظه، استریم، اشتراک، ابر');
    </script>
</body>
  </html>
